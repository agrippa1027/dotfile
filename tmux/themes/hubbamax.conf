# Hubbamax: flat, terminal-native status bar.
set -g status on
set -g status-justify left
set -g status-style "fg=#767676,bg=default,none"
set -g status-interval 30

set -g status-left-length 30
set -g status-left-style "fg=#767676,bg=default,none"
set -g status-left ' #S #[fg=#444444]/#[default] '
set -g status-right-length 10
set -g status-right-style "fg=#767676,bg=default,none"
set -g status-right '%H:%M '

set -g window-status-separator '  '
set -g window-status-style "fg=#767676,bg=default,none"
set -g window-status-format '#I #W'
set -g window-status-current-style "fg=#87afaf,bg=default,none,bold"
set -g window-status-current-format '#I #W'
set -g window-status-last-style "none"
set -g window-status-activity-style "fg=#bcbcbc,bg=default,none"
set -g window-status-bell-style "fg=#af5f5f,bg=default,none"

set -g pane-border-style "fg=#303030,bg=default"
set -g pane-active-border-style "fg=#5f8787,bg=default"
set -g message-style "fg=#bcbcbc,bg=#303030"
set -g message-command-style "fg=#87afaf,bg=#303030"
set -g mode-style "fg=#1c1c1c,bg=#87afaf"
