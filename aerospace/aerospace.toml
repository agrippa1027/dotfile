config-version = 2

after-startup-command = [
  'exec-and-forget open -ga "Zed"',
  'exec-and-forget open -ga "Firefox"',
  'exec-and-forget open -ga "BetterDisplay"',
  'workspace 1',
]
start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 0
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 4
    inner.vertical = 4
    outer.left = 8
    outer.bottom = 8
    outer.top = 8
    outer.right = 8

[mode.main.binding]
    cmd-h = [] # Disable "hide application"
    cmd-alt-h = [] # Disable "hide others"

    alt-o = 'focus-monitor --wrap-around next'

    alt-p = 'workspace --wrap-around prev'
    alt-n = 'workspace --wrap-around next'

    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-shift-minus = 'resize smart -50'
    alt-shift-equal = 'resize smart +50'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 0'
    alt-a = 'workspace a'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-0 = 'move-node-to-workspace 0'
    alt-shift-a = 'move-node-to-workspace a'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-f = 'fullscreen'
    # cmd-enter = 'exec-and-forget open -na "Ghostty"'
    cmd-alt-enter = 'exec-and-forget open -na "Ghostty" --args -e tmux new-session -A -s Work'
    cmd-enter = 'exec-and-forget open -na "Zed"'
    cmd-shift-enter = 'exec-and-forget open -na "Firefox"'

    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = [
    'layout floating tiling',
    'mode main',
    ]
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

# Workspace routing
[[on-window-detected]]
    if.app-id = 'com.google.Chrome'
    run = 'move-node-to-workspace 1'

[[on-window-detected]]
    if.app-id = 'org.mozilla.firefox'
    run = 'move-node-to-workspace 1'

[[on-window-detected]]
    if.app-id = 'dev.zed.Zed'
    run = 'move-node-to-workspace 2'

[[on-window-detected]]
    if.app-id = 'md.obsidian'
    run = 'move-node-to-workspace 3'

[[on-window-detected]]
    if.app-id = 'net.kovidgoyal.calibre'
    run = 'move-node-to-workspace 4'

[[on-window-detected]]
    if.app-id = 'com.hnc.Discord'
    run = 'move-node-to-workspace 7'

[[on-window-detected]]
    if.app-id = 'com.usebruno.app'
    run = 'move-node-to-workspace 6'

[[on-window-detected]]
    if.app-id = 'com.apple.systempreferences'
    run = 'layout floating'

[[on-window-detected]]
    if.app-name-regex-substring = 'activity'
    run = 'layout floating'

[[on-window-detected]]
    if.app-name-regex-substring = 'finder'
    run = 'layout floating'

[[on-window-detected]]
    if.app-name-regex-substring = 'messages'
    run = 'layout floating'

[[on-window-detected]]
    if.app-name-regex-substring = 'whatsapp'
    run = 'layout floating'

[[on-window-detected]]
    if.app-name-regex-substring = 'Font Book'
    run = 'layout floating'
